<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: same graphite-and-paper system as the catalog. White sheet, one hero with the stacked P/EN/CIL/PRISM mark, then ruled sections read top to bottom. */
:root{
  --paper:#f5f6f8; --sheet:#ffffff; --ink:#1d2027; --graphite:#5b606b; --rule:#dfe2e8;
  --accent:#2a46c9; --accent-soft:#e7ebfb; --chip:#eceef2;
  --f-display:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Hiragino Sans","PingFang SC","Noto Sans CJK KR",sans-serif;
  --f-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Hiragino Sans","PingFang SC","Noto Sans CJK KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15171c; --sheet:#1c1f26; --ink:#e9ebf0; --graphite:#a0a6b2; --rule:#2c303a;
  --accent:#8ea2ff; --accent-soft:#252c4a; --chip:#252932; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15171c; --sheet:#1c1f26; --ink:#e9ebf0; --graphite:#a0a6b2; --rule:#2c303a;
  --accent:#8ea2ff; --accent-soft:#252c4a; --chip:#252932; color-scheme:dark}
html:lang(ja){--f-display:"Hiragino Sans","Yu Gothic","Noto Sans JP","Noto Sans KR",sans-serif;--f-body:var(--f-display)}
html:lang(zh){--f-display:"PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans KR",sans-serif;--f-body:var(--f-display)}
html:lang(ko) body{word-break:keep-all;overflow-wrap:break-word}
body{background:var(--sheet);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:22px}
.mark{display:flex;flex-direction:column;gap:6px;text-decoration:none}
.wordmark{font-weight:600;letter-spacing:.02em;font-size:16px}
.prism{display:flex;height:3px;width:132px}
.prism i{flex:1}
.prism i:nth-child(1){background:#d9473f}.prism i:nth-child(2){background:#e98b2a}.prism i:nth-child(3){background:#e2c12f}
.prism i:nth-child(4){background:#3ea56a}.prism i:nth-child(5){background:#2f7fd1}.prism i:nth-child(6){background:#6a4fc6}
.right{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
nav.pages{display:flex;gap:18px;font-size:14px;font-weight:500}
nav.pages a{text-decoration:none;color:var(--graphite);padding-block:4px;border-bottom:2px solid transparent}
nav.pages a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
nav.pages a:hover{color:var(--ink)}
.langs{display:flex;gap:2px;background:var(--chip);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:var(--graphite);font:500 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px 56px;align-items:center;padding-block:48px 44px}
.hero .txt{display:grid;gap:16px;max-width:40rem;min-width:0}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.6vw,48px);line-height:1.18;letter-spacing:-.015em;margin:0;text-wrap:balance}
.hero p{margin:0;font-size:16.5px;color:var(--graphite);max-width:36rem}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14.5px var(--f-body);padding:11px 18px;border-radius:8px;cursor:pointer;text-decoration:none;border:1px solid var(--ink)}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn small{font-weight:500;opacity:.7;font-size:12px}
.btn:hover{opacity:.88}
.note{font-size:13px;color:var(--graphite);margin:0}
.other{font-size:13px;color:var(--graphite);display:flex;flex-wrap:wrap;gap:4px 12px}
.other button{border:0;background:none;padding:0;font:inherit;color:var(--graphite);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.other button:hover{color:var(--ink)}
.seal{width:clamp(200px,24vw,280px);aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}

/* stats */
.stats{background:var(--paper);border-block:1px solid var(--rule)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.stat{min-width:0;padding:22px 18px;display:grid;gap:2px;align-content:start;border-inline-start:1px solid var(--rule)}
.stat:first-child{border-inline-start:0;padding-inline-start:0}
.stat b{font-size:28px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:14px;font-weight:500}
.stat small{font-size:12.5px;color:var(--graphite)}
.stat .nw{white-space:nowrap}

/* sections */
section.sec{padding-block:56px 8px}
.sechead{display:grid;gap:6px;margin-bottom:24px;max-width:44rem}
.sechead .eyebrow{color:var(--accent)}
.sechead h2{font-family:var(--f-display);font-size:clamp(22px,2.8vw,28px);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance;line-height:1.3}
.sechead p{margin:0;color:var(--graphite)}

.do{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}
.do article{padding:20px 22px 22px 0;border-bottom:1px solid var(--rule);display:grid;gap:6px;align-content:start;min-width:0}
.do article:not(:nth-child(3n+1)){padding-inline-start:22px;border-inline-start:1px solid var(--rule)}
.do h3{margin:0;font-size:17px;font-weight:600}
.do p{margin:0;font-size:14.5px;color:var(--graphite)}

.brands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.brand{border:1px solid var(--rule);border-radius:10px;padding:22px;display:grid;gap:8px;align-content:start;min-width:0}
.brand .bt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.brand h3{margin:0;font-size:22px;font-weight:700}
.brand .kind{font-size:13px;color:var(--graphite)}
.brand p{margin:0;font-size:14.5px}
.brand .tagline{color:var(--graphite)}
.brand a{font-size:13.5px;color:var(--accent);text-decoration:none;margin-top:4px}
.brand a:hover{text-decoration:underline}
.minor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.minor div{padding:14px 0 0;border-top:1px solid var(--rule);display:grid;gap:2px}
.minor b{font-size:15.5px;font-weight:600}
.minor span{font-size:13.5px;color:var(--graphite)}

.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.work{display:flex;gap:16px;padding:18px;border:1px solid var(--rule);border-radius:10px;min-width:0}
.work img{width:76px;height:110px;flex:none;object-fit:cover;border-radius:3px;box-shadow:0 1px 3px rgb(0 0 0/.18);background:var(--chip)}
.work .wb{display:grid;gap:5px;align-content:start;min-width:0}
.work h3{margin:0;font-size:17px;font-weight:600;line-height:1.35;text-wrap:balance}
.work .orig{font-size:12.5px;color:var(--graphite);margin-top:-3px}
.work .by{font-size:13px;color:var(--graphite)}
.work ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.work li{font-size:13.5px;line-height:1.5;padding-inline-start:12px;position:relative}
.work li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.more{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
table.aw{width:100%;border-collapse:collapse;font-size:14px}
table.aw th,table.aw td{text-align:start;padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.aw th{font-weight:600;font-variant-numeric:tabular-nums;width:3.6em;color:var(--graphite)}
table.aw td small{display:block;color:var(--graphite);font-size:12.5px}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.tl b{font-variant-numeric:tabular-nums;color:var(--graphite);font-weight:600}

.contact{margin-block:56px 0;padding:28px;border-radius:12px;background:var(--paper);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:center}
.contact h2{margin:0 0 6px;font-size:22px}
.contact p{margin:0;color:var(--graphite)}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.mail code{font:600 17px var(--f-body);color:var(--ink);user-select:all}
.mail button{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:500 12.5px var(--f-body);padding:5px 10px;border-radius:6px;cursor:pointer}
.cinfo{font-size:13.5px;color:var(--graphite);display:grid;gap:2px;margin-top:10px}
.chan{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}
.store{display:grid;gap:6px;align-content:start;padding:24px;border-radius:12px;background:var(--ink);color:var(--sheet);text-decoration:none}
.store .sk{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.store b{font-size:22px}
.store span{font-size:14.5px;opacity:.85}
.store .go{margin-top:10px;font-weight:600;opacity:1}
.store:hover{opacity:.92}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;align-content:start}
.links a{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--rule);text-decoration:none;font-size:14.5px;min-width:0}
.links a span{color:var(--graphite);font-size:13px;white-space:nowrap}
.links a:hover b{color:var(--accent)}
.links b{font-weight:500}
@media (max-width:900px){.chan{grid-template-columns:1fr}}
@media (max-width:600px){.links{grid-template-columns:1fr}}
footer{margin-top:40px;padding-block:20px 48px;border-top:1px solid var(--rule);color:var(--graphite);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}.seal{justify-self:start;width:180px}
  .stats .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-inline-start:0;padding-inline-start:0}
  .stat:nth-child(n+3){border-top:1px solid var(--rule)}
  .works{grid-template-columns:repeat(2,minmax(0,1fr))}
  .do{grid-template-columns:repeat(2,minmax(0,1fr))}
  .do article:not(:nth-child(3n+1)){padding-inline-start:0;border-inline-start:0}
  .do article:nth-child(2n){padding-inline-start:22px;border-inline-start:1px solid var(--rule)}
  .two{grid-template-columns:1fr}
}
@media (max-width:600px){
  .seal{width:150px}
  .hero{padding-block:28px 32px}
  .stats .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat,.stat:first-child{padding:16px 0;border-inline-start:0;border-top:1px solid var(--rule)}
  .stat:nth-child(-n+2){border-top:0}
  .stat:nth-child(2n){padding-inline-start:14px;border-inline-start:1px solid var(--rule)}
  .works,.do,.brands,.minor{grid-template-columns:1fr}
  .do article:nth-child(2n){padding-inline-start:0;border-inline-start:0}
  .contact{grid-template-columns:1fr;padding:22px}
}

const CHURL=['https://blog.naver.com/pencilpress','https://blog.naver.com/dayonepress','https://www.youtube.com/@pencilpress','https://www.youtube.com/@dayonepress','https://www.instagram.com/dayone_press/'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang='ko';
try{const s=localStorage.getItem('pp-co');if(L.includes(s))lang=s}catch(e){}
{const h=location.hash.slice(1);if(L.includes(h))lang=h}
const cat=(l,brand)=>CATALOG+'#'+l;
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $('langs').innerHTML=L.map(l=>`<button type="button" data-l="${l}" aria-pressed="${l===lang}">${LN[l]}</button>`).join('');
  $('navCo').textContent=t.navCo;$('navCat').textContent=t.navCat;$('navCat').href=cat(lang);
  $('eyebrow').textContent=t.eyebrow;$('eyebrow').hidden=!t.eyebrow;$('h1').innerHTML=t.h1;$('lede').textContent=t.lede;
  $('dlt').textContent=t.dl;$('dls').textContent=t.dls;$('dl').href=PDF[lang];$('dl').setAttribute('download',PDF[lang]);
  $('cat').textContent=t.cat;$('cat').href=cat(lang);
  $('other').innerHTML=`<span>${t.other}:</span>`+['ko','en'].filter(l=>PDF[l]!==PDF[lang]).map(l=>`<button type="button" data-pdf="${l}">${LN[l]}</button>`).join('');
  $('stats').innerHTML=t.stats.map(s=>`<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span><small>${esc(s[2]).split(/(?<=[·・、,] ?)/).map(x=>`<span class="nw">${x}</span>`).join('<wbr>')}</small></div>`).join('');
  $('doE').textContent=t.doE;$('doH').textContent=t.doH;$('doH').hidden=!t.doH;$('doP').textContent=t.doP;$('doP').hidden=!t.doP;
  $('doL').innerHTML=t.doL.map(d=>`<article><h3>${esc(d[0])}</h3><p>${esc(d[1])}</p></article>`).join('');
  $('brE').textContent=t.brE;$('brH').textContent=t.brH;$('brH').hidden=!t.brH;
  $('brL').innerHTML=t.br.map(b=>`<div class="brand"><div class="bt"><h3>${esc(b[0])}</h3><span class="kind">${esc(b[1])} · ${esc(b[2])}</span></div><p class="tagline">${esc(b[3])}</p><p>${esc(b[4])}</p><a href="${cat(lang)}" target="_blank" rel="noopener">${esc(b[6])}</a></div>`).join('');
  $('brM').innerHTML=t.brM.map(m=>`<div><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div>`).join('');
  $('wkE').textContent=t.wkE;$('wkH').textContent=t.wkH;$('wkH').hidden=!t.wkH;$('wkP').textContent=t.wkP;$('wkMore').textContent=t.wkMore;$('wkMore').href=cat(lang);
  $('wkL').innerHTML=WORKS.map(w=>`<article class="work"><img src="${COVERS[w.cv]}" alt="" width="76" height="110" loading="lazy"><div class="wb"><h3>${esc(w.t[lang])}</h3>${lang!=='ko'?`<div class="orig">${esc(w.t.ko)}</div>`:''}<div class="by">${esc(w.a[lang])} · ${esc(w.k[lang])}</div><ul>${w.p[lang].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></article>`).join('');
  $('awE').textContent=t.awE;$('awH').textContent=t.awH;$('awH').hidden=!t.awH;
  $('awL').innerHTML=AW.map(a=>{const w=typeof a[2]==='number'?(a[2]>=0?WORKS[a[2]].t[lang]:''):a[2][lang];return `<tr><th>${a[0]}</th><td>${esc(a[1][lang])}${w?`<small>${esc(w)}</small>`:''}</td></tr>`}).join('');
  $('hiE').textContent=t.hiE;$('hiH').textContent=t.hiH;$('hiH').hidden=!t.hiH;
  $('hiL').innerHTML=HI.slice().reverse().map(h=>`<li><b>${h[0]}</b><span>${esc(h[1][lang])}</span></li>`).join('');
  $('chE').textContent=t.chE;$('chH').textContent=t.chH;$('chH').hidden=!t.chH;$('stK').textContent=t.stK;$('stK').hidden=!t.stK;$('stT').textContent=t.stT;$('stP').textContent=t.stP;$('stGo').textContent=t.stGo;
  $('chL').innerHTML=t.chL.map((c,i)=>`<a href="${CHURL[i]}" target="_blank" rel="noopener"><b>${esc(c[0])}</b><span>${esc(c[1])} ↗</span></a>`).join('');
  $('ctH').textContent=t.ctH;$('ctP').textContent=t.ctP;$('ctP').hidden=!t.ctP;$('copy').textContent=t.copy;
  $('cinfo').innerHTML=t.cinfo.map(c=>`<span>${esc(c)}</span>`).join('');
  $('dlt2').textContent=t.dl2;$('dl2').href=PDF[lang];$('dl2').setAttribute('download',PDF[lang]);
  $('f1').textContent=t.f1;$('f2').textContent='info@pencilprism.co.kr';
  $('dlnote').hidden=true;
  document.querySelectorAll('a[href^="works/"]').forEach(x=>{x.removeAttribute('target');x.textContent=x.textContent.replace('↗','→')});
  try{localStorage.setItem('pp-co',lang)}catch(e){}
}
async function savePdf(l,e){
  if(!window.claude||!window.claude.use)return; // public homepage: the plain link downloads the file
  if(e)e.preventDefault();
  const note=$('dlnote');note.hidden=true;
  try{const d=await window.claude.use('downloads');if(!d)throw{code:'unavailable'};
    const r=await fetch(PDF[l]);if(!r.ok)throw{code:'missing'};
    await d.save({filename:PDF[l],data:await r.blob()});
  }catch(err){if(err&&err.code==='declined')return;note.textContent=T[lang].dlfail;note.hidden=false}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b&&b.dataset.l){lang=b.dataset.l;render();return}
  if(b&&b.dataset.pdf){const l=b.dataset.pdf;if(window.claude&&window.claude.use)savePdf(l);else{const a=document.createElement('a');a.href=PDF[l];a.download=PDF[l];a.click()}return}
  const a=e.target.closest('#dl,#dl2');if(a)savePdf(lang,e);
});
$('copy').addEventListener('click',async()=>{
  const b=$('copy');
  try{await navigator.clipboard.writeText('info@pencilprism.co.kr');b.textContent=T[lang].copied;setTimeout(()=>b.textContent=T[lang].copy,1600)}
  catch(err){const r=document.createRange();r.selectNodeContents($('mail'));const s=getSelection();s.removeAllRanges();s.addRange(r)}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(L.includes(h)){lang=h;render()}});
render();
</script>
</body></html>
